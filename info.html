<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>Ma'lumot — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white">

<div id="app-header"></div>

<main>
  <section class="max-w-[760px] mx-auto px-4 sm:px-5 py-8 sm:py-12">
    <nav class="text-[13px] text-gray-500 dark:text-gray-400 mb-4 flex items-center gap-1.5" aria-label="Breadcrumb">
      <a href="index.html" class="hover:text-brand">Bosh sahifa</a>
      <span class="text-gray-300 dark:text-gray-600">/</span>
      <span id="crumb" class="text-gray-700 dark:text-gray-300">Ma'lumot</span>
    </nav>
    <h1 id="info-title" data-reveal class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-5 text-balance"></h1>
    <div id="info-body" data-reveal class="prose-uz text-[15px] sm:text-base text-gray-600 dark:text-gray-400 leading-relaxed"></div>

    <div data-reveal class="mt-10 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-800 p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <div class="font-bold">Savolingiz qoldimi?</div>
        <div class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">Telegram orqali yozing — tez javob beramiz.</div>
      </div>
      <a href="https://t.me/Mirkarim1" target="_blank" rel="noopener" class="inline-flex justify-center bg-brand hover:bg-brand-dark text-white font-bold px-5 py-2.5 rounded-xl transition-colors whitespace-nowrap">Telegramga yozish</a>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const topic = qs('topic');
    const content = INFO_CONTENT[topic] || { title: "Ma'lumot topilmadi", body: 'Siz izlagan sahifa mavjud emas. Bosh sahifaga qayting.' };
    document.title = content.title + ' — AutoMart.uz';
    document.getElementById('info-title').textContent = content.title;
    document.getElementById('crumb').textContent = content.title;
    const body = document.getElementById('info-body');
    body.innerHTML = '';
    String(content.body).split(/\n\s*\n|\n/).filter(Boolean).forEach((para) => {
      const p = document.createElement('p');
      p.textContent = para.trim();
      body.appendChild(p);
    });
  });
</script>
</body>
</html>
