<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ma'lumot — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { DEFAULT: '#2563eb', dark: '#1d4ed8', light: '#eaf1ff' } },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="bg-white text-gray-900">

<div id="app-header"></div>

<main>
  <section class="max-w-[760px] mx-auto px-5 py-12">
    <h1 id="info-title" class="text-2xl font-extrabold mb-4"></h1>
    <p id="info-body" class="text-gray-600 leading-relaxed"></p>
    <a href="index.html" class="inline-block mt-8 text-sm font-semibold text-brand hover:underline">← Bosh sahifaga qaytish</a>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const topic = qs('topic');
    const content = INFO_CONTENT[topic] || { title: "Ma'lumot topilmadi", body: 'Siz izlagan sahifa mavjud emas. Bosh sahifaga qayting.' };
    document.title = content.title + ' — AutoMart.uz';
    document.getElementById('info-title').textContent = content.title;
    document.getElementById('info-body').textContent = content.body;
  });
</script>
</body>
</html>
