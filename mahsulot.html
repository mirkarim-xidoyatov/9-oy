<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mahsulot — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { DEFAULT: '#2563eb', dark: '#1d4ed8', light: '#eaf1ff' } },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="bg-white text-gray-900">

<div id="app-header"></div>

<main>
  <section id="not-found" hidden class="max-w-[1240px] mx-auto px-5 py-16 text-center text-gray-500">
    <p class="mb-4 text-lg">Mahsulot topilmadi.</p>
    <a href="katalog.html" class="inline-block bg-brand hover:bg-brand-dark text-white font-bold px-5 py-2.5 rounded-[9px] transition-colors">Kataloglarga qaytish</a>
  </section>

  <section id="product-view" hidden class="max-w-[1240px] mx-auto px-5 py-8">
    <div id="breadcrumb" class="text-sm text-gray-500 mb-6"></div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
      <div class="relative max-w-[420px] mx-auto md:mx-0 w-full">
        <span id="p-badge" class="absolute top-4 left-4 bg-yellow-400 text-gray-900 text-xs font-extrabold px-2.5 py-1 rounded-lg z-10"></span>
        <img id="p-img" class="w-full aspect-square object-contain rounded-2xl bg-gray-100 p-6" />
      </div>
      <div>
        <h1 id="p-name" class="text-2xl font-extrabold mb-3"></h1>
        <div class="flex items-baseline gap-3 mb-1">
          <span id="p-price" class="text-3xl font-extrabold text-brand"></span>
          <span id="p-old-price" class="text-base text-gray-400 line-through"></span>
        </div>
        <div id="p-installment" class="text-sm text-gray-500 mb-6"></div>

        <div class="flex flex-wrap items-center gap-3 mb-6">
          <div class="flex items-center gap-1 border border-gray-200 rounded-lg">
            <button id="qty-minus" class="w-10 h-10 flex items-center justify-center text-lg text-gray-600 hover:text-brand">−</button>
            <span id="qty-val" class="w-8 text-center font-semibold">1</span>
            <button id="qty-plus" class="w-10 h-10 flex items-center justify-center text-lg text-gray-600 hover:text-brand">+</button>
          </div>
          <button id="add-cart" class="flex-1 bg-brand hover:bg-brand-dark text-white font-bold py-3 rounded-[10px] flex items-center justify-center gap-2 transition-colors">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/><path d="M2.5 3h2.4l2.1 11.3a2 2 0 0 0 2 1.7h8.2a2 2 0 0 0 2-1.6L21 7.5H6.2"/></svg>
            Savatga qo'shish
          </button>
          <button id="fav-toggle" class="w-12 h-12 rounded-lg border border-gray-200 flex items-center justify-center flex-shrink-0 text-gray-400" aria-label="Sevimlilarga qo'shish">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20.5S3.5 15 3.5 8.9A4.4 4.4 0 0 1 12 6.6a4.4 4.4 0 0 1 8.5 2.3C20.5 15 12 20.5 12 20.5Z"/></svg>
          </button>
        </div>

        <div class="border-t border-gray-200 pt-5 text-sm text-gray-600 leading-relaxed">
          Original ehtiyot qism, AutoMart.uz orqali kafolat bilan sotiladi. Toshkent bo'ylab 1-2 kun ichida yetkazib beramiz.
        </div>
      </div>
    </div>

    <div class="mt-14">
      <h2 class="text-xl font-extrabold mb-4">Shunga o'xshash mahsulotlar</h2>
      <div id="related-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const id = qs('id');
    const product = PRODUCTS.find((p) => p.id === id);

    if (!product) {
      document.getElementById('not-found').hidden = false;
      return;
    }
    document.getElementById('product-view').hidden = false;
    document.title = product.name + ' — AutoMart.uz';

    const cat = CATEGORIES.find((c) => c.id === product.category);
    document.getElementById('breadcrumb').innerHTML =
      `<a href="katalog.html" class="hover:text-brand">Kataloglar</a> / <a href="katalog.html?cat=${product.category}" class="hover:text-brand">${cat ? cat.name : ''}</a> / <span class="text-gray-700">${product.name}</span>`;

    document.getElementById('p-badge').textContent = `-${product.discount}%`;
    document.getElementById('p-img').src = product.img;
    document.getElementById('p-img').alt = product.name;
    document.getElementById('p-name').textContent = product.name;
    document.getElementById('p-price').textContent = money(product.price);
    document.getElementById('p-old-price').textContent = money(product.oldPrice);
    document.getElementById('p-installment').textContent = `${money(Math.round(product.price / 12))} x 12 oy muddatli to'lovda`;

    let qty = 1;
    const qtyEl = document.getElementById('qty-val');
    document.getElementById('qty-minus').addEventListener('click', () => { qty = Math.max(1, qty - 1); qtyEl.textContent = qty; });
    document.getElementById('qty-plus').addEventListener('click', () => { qty += 1; qtyEl.textContent = qty; });

    const addBtn = document.getElementById('add-cart');
    addBtn.addEventListener('click', () => {
      addToCart(product.id, qty);
      const original = addBtn.innerHTML;
      addBtn.innerHTML = "Qo'shildi ✓";
      setTimeout(() => { addBtn.innerHTML = original; }, 1200);
    });

    const favBtn = document.getElementById('fav-toggle');
    function paintFav() {
      const active = isFavorite(product.id);
      favBtn.classList.toggle('text-brand', active);
      favBtn.classList.toggle('border-brand', active);
      favBtn.classList.toggle('text-gray-400', !active);
      favBtn.querySelector('svg').setAttribute('fill', active ? 'currentColor' : 'none');
    }
    paintFav();
    favBtn.addEventListener('click', () => { toggleFavorite(product.id); paintFav(); });

    const related = PRODUCTS.filter((p) => p.category === product.category && p.id !== product.id).slice(0, 4);
    renderProductGrid(document.getElementById('related-grid'), related, "O'xshash mahsulot topilmadi.");
  });
</script>
</body>
</html>
