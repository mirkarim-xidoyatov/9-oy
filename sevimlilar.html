<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sevimlilar — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { DEFAULT: '#2563eb', dark: '#1d4ed8', light: '#eaf1ff' } },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="bg-white text-gray-900">

<div id="app-header"></div>

<main>
  <section class="max-w-[1240px] mx-auto px-5 py-8">
    <h1 class="text-2xl font-extrabold mb-6">Sevimlilar</h1>
    <div id="fav-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('fav-grid');
    grid.dataset.syncFavPage = 'true';
    const favs = getFavorites();
    const list = PRODUCTS.filter((p) => favs.includes(p.id));
    renderProductGrid(grid, list, "Sevimlilar ro'yxati bo'sh. Mahsulotlarni yurak belgisi orqali shu yerga qo'shing.");
  });
</script>
</body>
</html>
