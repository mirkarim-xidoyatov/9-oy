<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>Sevimlilar — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
</head>
<body class="bg-white text-gray-900">

<div id="app-header"></div>

<main>
  <section class="max-w-[1240px] mx-auto px-4 sm:px-5 py-6 sm:py-8">
    <div class="flex items-end justify-between gap-3 mb-5 sm:mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Sevimlilar</h1>
        <p id="fav-count" class="text-sm text-gray-500 mt-1"></p>
      </div>
      <a href="katalog.html" class="text-sm font-semibold text-brand hover:underline whitespace-nowrap">Katalogga →</a>
    </div>
    <div id="fav-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4"></div>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('fav-grid');
    grid.dataset.syncFavPage = 'true';
    const favs = getFavorites();
    const list = PRODUCTS.filter((p) => favs.includes(p.id));
    document.getElementById('fav-count').textContent = list.length ? `${list.length} ta mahsulot` : '';
    renderProductGrid(grid, list, "Sevimlilar ro'yxati bo'sh. Mahsulotlarni yurak belgisi orqali shu yerga qo'shing.", { href: 'katalog.html', text: 'Mahsulotlarni ko\'rish' });
  });
</script>
</body>
</html>
