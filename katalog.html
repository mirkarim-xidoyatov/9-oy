<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kataloglar — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { DEFAULT: '#2563eb', dark: '#1d4ed8', light: '#eaf1ff' } },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="bg-white text-gray-900">

<div id="app-header"></div>

<main>
  <section class="max-w-[1240px] mx-auto px-5 py-8">
    <h1 id="page-title" class="text-2xl font-extrabold mb-1">Kataloglar</h1>
    <p id="result-count" class="text-sm text-gray-500 mb-6"></p>

    <div id="cat-filters" class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-6"></div>

    <div id="katalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const activeCat = qs('cat') || '';
    const q = (qs('q') || '').trim().toLowerCase();
    const filter = qs('filter') || '';

    const chipsWrap = document.getElementById('cat-filters');
    function chipClass(active) {
      return active
        ? 'flex-shrink-0 whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold bg-brand text-white transition-colors'
        : 'flex-shrink-0 whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors';
    }
    const allChip = `<a href="katalog.html" class="${chipClass(!activeCat)}">Barchasi</a>`;
    const chips = CATEGORIES.map(
      (c) => `<a href="katalog.html?cat=${c.id}" class="${chipClass(activeCat === c.id)}">${c.name}</a>`
    );
    chipsWrap.innerHTML = allChip + chips.join('');

    let list = PRODUCTS.slice();
    if (activeCat) list = list.filter((p) => p.category === activeCat);
    if (q) {
      const words = q.split(/\s+/).filter(Boolean);
      list = list.filter((p) => {
        const cat = CATEGORIES.find((c) => c.id === p.category);
        const haystack = (p.name + ' ' + (cat ? cat.name : '')).toLowerCase();
        return words.every((w) => haystack.includes(w));
      });
    }
    if (filter === 'discount') list = list.slice().sort((a, b) => b.discount - a.discount);

    const titleEl = document.getElementById('page-title');
    if (q) titleEl.textContent = `"${q}" bo'yicha qidiruv natijalari`;
    else if (activeCat) titleEl.textContent = CATEGORIES.find((c) => c.id === activeCat)?.name || 'Kataloglar';
    else if (filter === 'discount') titleEl.textContent = 'Chegirmalar';
    else titleEl.textContent = 'Barcha toifalar';

    document.getElementById('result-count').textContent = `${list.length} ta mahsulot topildi`;

    renderProductGrid(document.getElementById('katalog-grid'), list, "Bu bo'limda hozircha mahsulot yo'q. Boshqa toifani tanlab ko'ring.");
  });
</script>
</body>
</html>
