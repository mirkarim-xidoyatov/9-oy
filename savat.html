<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>Savat — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
</head>
<body class="bg-white text-gray-900">

<div id="app-header"></div>

<main>
  <section class="max-w-[1240px] mx-auto px-4 sm:px-5 py-6 sm:py-8">
    <div class="flex items-end justify-between gap-3 mb-5 sm:mb-6">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Savat</h1>
      <a href="katalog.html" class="text-sm font-semibold text-brand hover:underline whitespace-nowrap">Xaridni davom ettirish →</a>
    </div>

    <div id="cart-empty" hidden></div>

    <div id="cart-content" hidden class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_360px] gap-6 lg:gap-8 items-start">
      <div id="cart-items" class="flex flex-col gap-3 sm:gap-4"></div>
      <aside class="bg-gray-50 border border-gray-200 rounded-2xl p-5 sm:p-6 lg:sticky lg:top-[92px]">
        <h3 class="font-bold text-lg mb-4">Buyurtma xulosasi</h3>
        <div class="flex justify-between text-sm text-gray-600 mb-2 tabular">
          <span>Mahsulotlar (<span id="sum-count">0</span>)</span>
          <span id="sum-subtotal">0 so'm</span>
        </div>
        <div class="flex justify-between text-sm text-gray-600 mb-2">
          <span>Yetkazib berish</span><span class="text-emerald-600 font-semibold">Bepul</span>
        </div>
        <div class="flex justify-between text-sm text-gray-600 mb-4 tabular">
          <span>CLUB bonus (3%)</span><span id="sum-bonus" class="text-brand font-semibold">+0</span>
        </div>
        <div class="flex justify-between font-extrabold text-lg border-t border-gray-200 pt-4 mb-5 tabular">
          <span>Jami</span><span id="sum-total">0 so'm</span>
        </div>
        <button id="checkout-btn" class="btn-shine press-fx w-full h-12 bg-brand hover:bg-brand-dark text-white font-bold rounded-xl transition-colors shadow-lift">Buyurtma berish</button>
        <p class="text-[12px] text-gray-400 text-center mt-3">Buyurtma bergach menejer siz bilan bog'lanadi</p>
      </aside>
    </div>

    <div id="order-success" hidden class="text-center py-12 sm:py-16 px-4">
      <div class="w-20 h-20 mx-auto mb-5 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center animate-pop">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
      </div>
      <h2 class="text-xl sm:text-2xl font-extrabold mb-2">Buyurtmangiz qabul qilindi!</h2>
      <p class="text-gray-500 mb-6">Buyurtma raqami: <span id="order-id" class="font-bold text-gray-900 tabular"></span></p>
      <div class="flex gap-3 justify-center flex-wrap">
        <a href="buyurtmalar.html" class="bg-brand hover:bg-brand-dark text-white font-bold px-5 py-2.5 rounded-xl transition-colors">Buyurtmalarim</a>
        <a href="katalog.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-5 py-2.5 rounded-xl transition-colors">Xaridni davom ettirish</a>
      </div>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  function cartRowHTML(item) {
    const p = item.product;
    return `<div class="grid grid-cols-[72px_1fr] sm:grid-cols-[88px_1fr_auto] gap-x-3.5 sm:gap-x-5 gap-y-3 border border-gray-200 rounded-2xl p-3.5 sm:p-4 items-center" data-id="${p.id}">
      <a href="mahsulot.html?id=${p.id}" class="block rounded-xl overflow-hidden img-frame">
        <img src="${p.img}" class="w-full aspect-square object-cover" alt="${p.name}" loading="lazy">
      </a>
      <div class="min-w-0">
        <a href="mahsulot.html?id=${p.id}" class="font-semibold text-[13.5px] sm:text-sm leading-snug hover:text-brand line-clamp-2">${p.name}</a>
        <div class="text-gray-500 text-[12.5px] mt-1 tabular">${money(p.price)} / dona</div>
      </div>
      <div class="col-span-2 sm:col-span-1 flex items-center justify-between sm:justify-end gap-3 sm:gap-5 min-w-0">
        <div class="flex items-center border border-gray-200 rounded-lg h-9 flex-shrink-0">
          <button class="qty-minus w-9 h-full flex items-center justify-center text-lg text-gray-600 hover:text-brand hover:bg-gray-50 rounded-l-lg transition-colors" aria-label="Kamaytirish">−</button>
          <span class="qty-val w-8 text-center text-sm font-bold tabular">${item.qty}</span>
          <button class="qty-plus w-9 h-full flex items-center justify-center text-lg text-gray-600 hover:text-brand hover:bg-gray-50 rounded-r-lg transition-colors" aria-label="Ko'paytirish">+</button>
        </div>
        <div class="font-extrabold text-[15px] sm:text-base text-gray-900 sm:w-32 sm:text-right tabular whitespace-nowrap">${money(p.price * item.qty)}</div>
        <button class="remove-btn text-gray-400 hover:text-red-500 hover:bg-red-50 w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0 transition-colors" aria-label="O'chirish">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg>
        </button>
      </div>
    </div>`;
  }

  function renderCart() {
    const items = cartItemsWithData();
    const empty = document.getElementById('cart-empty');
    empty.hidden = items.length > 0;
    document.getElementById('cart-content').hidden = items.length === 0;
    if (!items.length) {
      empty.innerHTML = emptyStateHTML("Savatingiz bo'sh. Kerakli ehtiyot qismlarni katalogdan tanlang.", { href: 'katalog.html', text: 'Xarid qilishni boshlash' });
      return;
    }

    document.getElementById('cart-items').innerHTML = items.map(cartRowHTML).join('');
    const total = cartTotal();
    document.getElementById('sum-count').textContent = items.reduce((s, i) => s + i.qty, 0);
    document.getElementById('sum-subtotal').textContent = money(total);
    document.getElementById('sum-bonus').textContent = '+' + money(Math.round(total * 0.03));
    document.getElementById('sum-total').textContent = money(total);

    document.querySelectorAll('.qty-minus').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.closest('[data-id]').dataset.id;
        const item = getCart().find((i) => i.id === id);
        setQty(id, (item?.qty || 1) - 1);
        renderCart();
      });
    });
    document.querySelectorAll('.qty-plus').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.closest('[data-id]').dataset.id;
        const item = getCart().find((i) => i.id === id);
        setQty(id, (item?.qty || 0) + 1);
        renderCart();
      });
    });
    document.querySelectorAll('.remove-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        removeFromCart(btn.closest('[data-id]').dataset.id);
        renderCart();
      });
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderCart();
    document.getElementById('checkout-btn').addEventListener('click', () => {
      const order = placeOrder();
      if (!order) return;
      document.getElementById('cart-content').hidden = true;
      document.getElementById('cart-empty').hidden = true;
      document.getElementById('order-success').hidden = false;
      document.getElementById('order-id').textContent = order.id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
</script>
</body>
</html>
