<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Savat — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { DEFAULT: '#2563eb', dark: '#1d4ed8', light: '#eaf1ff' } },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="bg-white text-gray-900">

<div id="app-header"></div>

<main>
  <section class="max-w-[1240px] mx-auto px-5 py-8">
    <h1 class="text-2xl font-extrabold mb-6">Savat</h1>

    <div id="cart-empty" hidden class="text-center py-20 text-gray-500">
      <p class="mb-4 text-lg">Savatingiz bo'sh</p>
      <a href="katalog.html" class="inline-block bg-brand hover:bg-brand-dark text-white font-bold px-5 py-2.5 rounded-[9px] transition-colors">Xarid qilishni boshlash</a>
    </div>

    <div id="cart-content" hidden class="grid grid-cols-1 lg:grid-cols-[1fr_340px] gap-8">
      <div id="cart-items" class="flex flex-col gap-4"></div>
      <div class="bg-gray-50 border border-gray-200 rounded-2xl p-6 h-fit">
        <h3 class="font-bold text-lg mb-4">Buyurtma xulosasi</h3>
        <div class="flex justify-between text-sm text-gray-600 mb-2">
          <span>Mahsulotlar (<span id="sum-count">0</span>)</span>
          <span id="sum-subtotal">0 so'm</span>
        </div>
        <div class="flex justify-between text-sm text-gray-600 mb-4">
          <span>Yetkazib berish</span><span>Bepul</span>
        </div>
        <div class="flex justify-between font-extrabold text-lg border-t border-gray-200 pt-4 mb-5">
          <span>Jami</span><span id="sum-total">0 so'm</span>
        </div>
        <button id="checkout-btn" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 rounded-[10px] transition-colors">Buyurtma berish</button>
      </div>
    </div>

    <div id="order-success" hidden class="text-center py-16">
      <div class="text-5xl mb-4">✅</div>
      <h2 class="text-xl font-bold mb-2">Buyurtmangiz qabul qilindi!</h2>
      <p class="text-gray-500 mb-6">Buyurtma raqami: <span id="order-id" class="font-semibold text-gray-900"></span></p>
      <div class="flex gap-3 justify-center flex-wrap">
        <a href="buyurtmalar.html" class="bg-brand hover:bg-brand-dark text-white font-bold px-5 py-2.5 rounded-[9px] transition-colors">Buyurtmalarim</a>
        <a href="katalog.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-5 py-2.5 rounded-[9px] transition-colors">Xaridni davom ettirish</a>
      </div>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  function cartRowHTML(item) {
    const p = item.product;
    return `<div class="flex flex-wrap gap-4 border border-gray-200 rounded-2xl p-4 items-center" data-id="${p.id}">
      <img src="${p.img}" class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-xl bg-gray-100 flex-shrink-0" alt="${p.name}">
      <div class="flex-1 min-w-[140px]">
        <a href="mahsulot.html?id=${p.id}" class="font-semibold text-sm mb-1 hover:text-brand block">${p.name}</a>
        <div class="text-brand font-extrabold">${money(p.price)}</div>
      </div>
      <div class="flex items-center gap-4 ml-auto">
        <div class="flex items-center gap-1 border border-gray-200 rounded-lg flex-shrink-0">
          <button class="qty-minus w-8 h-8 flex items-center justify-center text-lg text-gray-600 hover:text-brand">−</button>
          <span class="qty-val w-6 text-center text-sm font-semibold">${item.qty}</span>
          <button class="qty-plus w-8 h-8 flex items-center justify-center text-lg text-gray-600 hover:text-brand">+</button>
        </div>
        <div class="w-24 text-right font-bold hidden sm:block flex-shrink-0">${money(p.price * item.qty)}</div>
        <button class="remove-btn text-gray-400 hover:text-brand w-8 h-8 flex items-center justify-center flex-shrink-0" aria-label="O'chirish">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg>
        </button>
      </div>
    </div>`;
  }

  function renderCart() {
    const items = cartItemsWithData();
    document.getElementById('cart-empty').hidden = items.length > 0;
    document.getElementById('cart-content').hidden = items.length === 0;
    if (!items.length) return;

    document.getElementById('cart-items').innerHTML = items.map(cartRowHTML).join('');
    document.getElementById('sum-count').textContent = items.reduce((s, i) => s + i.qty, 0);
    document.getElementById('sum-subtotal').textContent = money(cartTotal());
    document.getElementById('sum-total').textContent = money(cartTotal());

    document.querySelectorAll('.qty-minus').forEach((btn) => {
      btn.addEventListener('click', () => {
        const row = btn.closest('[data-id]');
        const id = row.dataset.id;
        const item = getCart().find((i) => i.id === id);
        setQty(id, (item?.qty || 1) - 1);
        renderCart();
      });
    });
    document.querySelectorAll('.qty-plus').forEach((btn) => {
      btn.addEventListener('click', () => {
        const row = btn.closest('[data-id]');
        const id = row.dataset.id;
        const item = getCart().find((i) => i.id === id);
        setQty(id, (item?.qty || 0) + 1);
        renderCart();
      });
    });
    document.querySelectorAll('.remove-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        removeFromCart(btn.closest('[data-id]').dataset.id);
        renderCart();
      });
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderCart();
    document.getElementById('checkout-btn').addEventListener('click', () => {
      const order = placeOrder();
      if (!order) return;
      document.getElementById('cart-content').hidden = true;
      document.getElementById('cart-empty').hidden = true;
      document.getElementById('order-success').hidden = false;
      document.getElementById('order-id').textContent = order.id;
    });
  });
</script>
</body>
</html>
