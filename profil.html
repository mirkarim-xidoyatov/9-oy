<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profil — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { DEFAULT: '#2563eb', dark: '#1d4ed8', light: '#eaf1ff' } },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="bg-white text-gray-900">

<div id="app-header"></div>

<main>
  <section class="max-w-[560px] mx-auto px-5 py-8">
    <h1 class="text-2xl font-extrabold mb-6">Profil</h1>

    <div id="profile-view" hidden class="border border-gray-200 rounded-2xl p-6">
      <div class="flex items-center gap-4 mb-5">
        <div class="w-14 h-14 rounded-full bg-brand text-white flex items-center justify-center font-extrabold text-xl" id="profile-initial">A</div>
        <div>
          <div id="profile-name" class="font-bold text-lg"></div>
          <div id="profile-phone" class="text-sm text-gray-500"></div>
        </div>
      </div>
      <div class="text-sm text-gray-600 mb-5" id="profile-email"></div>
      <button id="edit-profile" class="text-sm font-semibold text-brand hover:underline mr-4">Tahrirlash</button>
      <button id="logout-profile" class="text-sm font-semibold text-gray-500 hover:text-brand">Chiqish</button>
    </div>

    <form id="profile-form" class="border border-gray-200 rounded-2xl p-6 flex flex-col gap-4">
      <div>
        <label class="text-sm font-semibold mb-1.5 block">Ism familiya</label>
        <input id="p-name" required placeholder="Masalan: Aziz Muminov" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-brand" />
      </div>
      <div>
        <label class="text-sm font-semibold mb-1.5 block">Telefon raqam</label>
        <input id="p-phone" required placeholder="+998 90 123 45 67" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-brand" />
      </div>
      <div>
        <label class="text-sm font-semibold mb-1.5 block">Email (ixtiyoriy)</label>
        <input id="p-email" type="email" placeholder="email@misol.uz" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-brand" />
      </div>
      <button type="submit" class="bg-brand hover:bg-brand-dark text-white font-bold py-3 rounded-lg transition-colors mt-2">Saqlash</button>
    </form>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  function showView() {
    const profile = getProfile();
    const view = document.getElementById('profile-view');
    const form = document.getElementById('profile-form');
    if (profile) {
      view.hidden = false;
      form.hidden = true;
      document.getElementById('profile-name').textContent = profile.name;
      document.getElementById('profile-phone').textContent = profile.phone;
      document.getElementById('profile-email').textContent = profile.email || '';
      document.getElementById('profile-initial').textContent = profile.name.trim().charAt(0).toUpperCase() || 'A';
    } else {
      view.hidden = true;
      form.hidden = false;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    showView();

    document.getElementById('profile-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('p-name').value.trim();
      const phone = document.getElementById('p-phone').value.trim();
      const email = document.getElementById('p-email').value.trim();
      if (!name || !phone) return;
      setProfile({ name, phone, email });
      showView();
    });

    document.getElementById('edit-profile').addEventListener('click', () => {
      const profile = getProfile();
      document.getElementById('p-name').value = profile?.name || '';
      document.getElementById('p-phone').value = profile?.phone || '';
      document.getElementById('p-email').value = profile?.email || '';
      document.getElementById('profile-view').hidden = true;
      document.getElementById('profile-form').hidden = false;
    });

    document.getElementById('logout-profile').addEventListener('click', () => {
      clearProfile();
      showView();
    });
  });
</script>
</body>
</html>
