<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>Buyurtmalarim — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
</head>
<body class="bg-white text-gray-900">

<div id="app-header"></div>

<main>
  <section class="max-w-[1240px] mx-auto px-4 sm:px-5 py-6 sm:py-8">
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-1">Buyurtmalarim</h1>
    <p id="orders-count" class="text-sm text-gray-500 mb-6"></p>
    <div id="orders-empty" hidden></div>
    <div id="orders-list" class="flex flex-col gap-3 sm:gap-4 max-w-3xl"></div>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  function orderCardHTML(o) {
    const date = new Date(o.date).toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const items = o.items.map((i) => {
      const p = PRODUCTS.find((x) => x.id === i.id);
      return `<div class="flex items-center gap-3 py-2">
        ${p ? `<img src="${p.img}" alt="" class="w-11 h-11 rounded-lg object-cover img-frame flex-shrink-0" loading="lazy" />` : ''}
        <div class="flex-1 min-w-0">
          <div class="text-[13.5px] font-medium text-gray-800 line-clamp-1">${i.name}</div>
          <div class="text-xs text-gray-500 tabular">${money(i.price)} × ${i.qty}</div>
        </div>
        <div class="text-sm font-semibold tabular whitespace-nowrap">${money(i.price * i.qty)}</div>
      </div>`;
    }).join('');
    return `<div class="border border-gray-200 rounded-2xl p-4 sm:p-5 hover:shadow-card transition">
      <div class="flex items-center justify-between gap-3 mb-3 flex-wrap">
        <div>
          <div class="font-bold tabular">Buyurtma № ${o.id}</div>
          <div class="text-xs text-gray-500 mt-0.5 tabular">${date}</div>
        </div>
        <span class="inline-flex items-center gap-1.5 text-[12px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Qayta ishlanmoqda
        </span>
      </div>
      <div class="border-t border-gray-100 divide-y divide-gray-100">${items}</div>
      <div class="flex justify-between items-center font-extrabold border-t border-gray-100 mt-1 pt-3 tabular">
        <span>Jami</span><span class="text-lg">${money(o.total)}</span>
      </div>
    </div>`;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const orders = getOrders();
    const empty = document.getElementById('orders-empty');
    empty.hidden = orders.length > 0;
    if (!orders.length) empty.innerHTML = emptyStateHTML("Hali buyurtmalar yo'q. Birinchi buyurtmangizni bering — biz tez yetkazamiz.", { href: 'katalog.html', text: 'Xarid qilishni boshlash' });
    document.getElementById('orders-count').textContent = orders.length ? `${orders.length} ta buyurtma` : '';
    document.getElementById('orders-list').innerHTML = orders.map(orderCardHTML).join('');
  });
</script>
</body>
</html>
