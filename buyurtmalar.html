<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buyurtmalarim — AutoMart.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: { DEFAULT: '#2563eb', dark: '#1d4ed8', light: '#eaf1ff' } },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="bg-white text-gray-900">

<div id="app-header"></div>

<main>
  <section class="max-w-[1240px] mx-auto px-5 py-8">
    <h1 class="text-2xl font-extrabold mb-6">Buyurtmalarim</h1>
    <div id="orders-empty" hidden class="text-center py-20 text-gray-500">
      <p class="mb-4 text-lg">Hali buyurtmalar yo'q</p>
      <a href="katalog.html" class="inline-block bg-brand hover:bg-brand-dark text-white font-bold px-5 py-2.5 rounded-[9px] transition-colors">Xarid qilishni boshlash</a>
    </div>
    <div id="orders-list" class="flex flex-col gap-4 max-w-2xl"></div>
  </section>
</main>

<div id="app-footer"></div>

<script src="store.js"></script>
<script src="components.js"></script>
<script>
  function orderCardHTML(o) {
    const date = new Date(o.date).toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const items = o.items
      .map((i) => `<div class="flex justify-between text-sm text-gray-600 py-1"><span>${i.name} × ${i.qty}</span><span>${money(i.price * i.qty)}</span></div>`)
      .join('');
    return `<div class="border border-gray-200 rounded-2xl p-5">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div class="font-bold">Buyurtma № ${o.id}</div>
        <div class="text-xs text-gray-500">${date}</div>
      </div>
      <div class="border-t border-gray-100 pt-3">${items}</div>
      <div class="flex justify-between font-extrabold border-t border-gray-100 mt-3 pt-3">
        <span>Jami</span><span>${money(o.total)}</span>
      </div>
    </div>`;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const orders = getOrders();
    document.getElementById('orders-empty').hidden = orders.length > 0;
    document.getElementById('orders-list').innerHTML = orders.map(orderCardHTML).join('');
  });
</script>
</body>
</html>
